version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password123
      - AzureAdB2C__Instance=https://{your-tenant}.b2clogin.com/
      - AzureAdB2C__ClientId={your-client-id}
      - AzureAdB2C__ClientSecret={your-client-secret}
      - AzureAdB2C__Domain={your-tenant}.onmicrosoft.com
      - AzureAdB2C__TenantId={your-tenant-id}
      - AzureStorage__ConnectionString={your-storage-connection-string}
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/app.db
      - Database__Provider=Sqlite
    volumes:
      - ./data:/app/data
      - ~/.aspnet/https:/https:ro
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    # Optional: Comment out if using SQLite instead

volumes:
  sqldata:
